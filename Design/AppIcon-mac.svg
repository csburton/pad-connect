<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D6A2"/>
      <stop offset="1" stop-color="#0B8F84"/>
    </linearGradient>
  </defs>
  <defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.28"/></filter></defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#sh)"/>
  <g transform="translate(512,512) scale(0.8) translate(-512,-512)">
  <g transform="translate(66,-68)">
    <ellipse cx="512" cy="676" rx="380" ry="26" fill="#000" opacity="0.16"/>
    <!-- speed lines -->
    <g stroke="#FFFFFF" stroke-linecap="round" stroke-width="22" opacity="0.75">
      <line x1="96" y1="505" x2="214" y2="505"/>
      <line x1="40" y1="548" x2="172" y2="548"/>
      <line x1="84" y1="591" x2="130" y2="591"/>
    </g>
    <!-- side and front faces -->
