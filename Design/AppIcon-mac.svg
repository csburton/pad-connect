      <line x1="322" y1="586" x2="422" y2="484"/>
      <line x1="382" y1="586" x2="482" y2="484"/>
      <line x1="442" y1="586" x2="542" y2="484"/>
      <line x1="502" y1="586" x2="602" y2="484"/>
      <line x1="562" y1="586" x2="662" y2="484"/>
    </g>
    <!-- motor cover display -->
    <polygon points="672,566 716,566 760,520 716,520" fill="#2ECC99" stroke="#2ECC99" stroke-width="10" stroke-linejoin="round"/>
    <!-- front edge highlight -->
