    <polygon points="170,600 730,600 730,652 170,652" fill="#E3F4EF" stroke="#E3F4EF" stroke-width="16" stroke-linejoin="round"/>
    <!-- top deck -->
    <polygon points="170,600 730,600 854,470 294,470" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>
    <!-- belt -->
    <polygon points="214,586 618,586 718,484 314,484" fill="#1E2A2E" stroke="#1E2A2E" stroke-width="8" stroke-linejoin="round"/>
    <g stroke="#34474D" stroke-width="5" stroke-linecap="round">
