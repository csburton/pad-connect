# Generate PadConnect.xcodeproj with: xcodegen
name: PadConnect
options:
  bundleIdPrefix: com.csburton
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

packages:
  PadKit:
    path: PadKit

targets:
  PadConnect:
    type: application
    platform: iOS
    sources:
      - App/Shared
      - App/iOS
      - App/LiveActivity
      - App/Resources
    dependencies:
      - package: PadKit
      - target: PadConnectWatch
      - target: PadConnectWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.csburton.padconnect
        PRODUCT_NAME: PadConnect
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: PadConnect
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
          - workout-processing
        NSBluetoothAlwaysUsageDescription: PadConnect uses Bluetooth to control your walking pad.
        NSHealthShareUsageDescription: PadConnect saves your walks to Apple Health.
        NSHealthUpdateUsageDescription: PadConnect saves your walks to Apple Health.
    entitlements:
      path: App/iOS/PadConnect.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  PadConnectWidgets:
    type: app-extension
    platform: iOS
    sources:
      - App/Widgets
      - App/LiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.csburton.padconnect.widgets
        PRODUCT_NAME: PadConnectWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: App/Widgets/Info.plist
      properties:
        CFBundleDisplayName: PadConnect
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  PadConnectMac:
    type: application
    platform: macOS
    sources:
      - App/Shared
      - App/macOS
      - App/Resources
    dependencies:
      - package: PadKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.csburton.padconnect.mac
        PRODUCT_NAME: PadConnect
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: PadConnect
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSBluetoothAlwaysUsageDescription: PadConnect uses Bluetooth to control your walking pad.
    entitlements:
      path: App/macOS/PadConnect.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true

  PadConnectWatch:
    type: application
    platform: watchOS
    sources:
      - App/watchOS
      - App/Resources
    dependencies:
      - package: PadKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.csburton.padconnect.watchkitapp
        PRODUCT_NAME: PadConnectWatch
    info:
      path: App/watchOS/Info.plist
      properties:
        CFBundleDisplayName: PadConnect
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.csburton.padconnect
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: PadConnect reads your heart rate and calories during walks.
        NSHealthUpdateUsageDescription: PadConnect saves your walks to Apple Health.
    entitlements:
      path: App/watchOS/PadConnect.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
